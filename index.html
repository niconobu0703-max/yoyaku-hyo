<script>

/* =========================
   基本設定
========================= */

const courseMinutes=[40,60,90,100,120];

const defaultSettings={
 girls:["ことねさん","ナヨンさん"],

 courses:{
  40:{price:0,girl:6,shop:4},
  60:{price:0,girl:6,shop:4},
  90:{price:0,girl:7,shop:3},
  100:{price:0,girl:7,shop:3},
  120:{price:0,girl:6,shop:4}
 }
};

let settings=loadSettings();

let selectedId=null;


/* =========================
   設定
========================= */

function loadSettings(){

 try{

  const saved=localStorage.getItem("shop_settings");

  if(!saved){
   return JSON.parse(JSON.stringify(defaultSettings));
  }

  return normalizeSettings(JSON.parse(saved));

 }catch(e){

  return JSON.parse(JSON.stringify(defaultSettings));

 }

}


function normalizeSettings(s){

 const result={
  girls:Array.isArray(s.girls)&&s.girls.length
   ?s.girls
   :[...defaultSettings.girls],
  courses:{}
 };

 courseMinutes.forEach(m=>{

  const c=s.courses&&s.courses[m]
   ?s.courses[m]
   :defaultSettings.courses[m];

  result.courses[m]={
   price:Number(c.price)||0,
   girl:Number(c.girl)||0,
   shop:Number(c.shop)||0
  };

 });

 return result;

}


function openSettings(){

 document.getElementById("girlsBox").innerHTML=
  settings.girls.map((g,i)=>`

   <div class="row">

    <input
     class="girlName"
     value="${esc(g)}"
    >

    <button onclick="removeGirl(${i})">
     削除
    </button>

   </div>

  `).join("");


 document.getElementById("coursesBox").innerHTML=
  courseMinutes.map(m=>{

   const c=settings.courses[m];

   return `

   <div class="course">

    <h3>${m}分</h3>

    <div class="row">

     <label>コース料金</label>

     <input
      id="p${m}"
      type="number"
      min="0"
      value="${c.price}"
     >

     <span>円</span>

    </div>

    <div class="row">

     <label>取り分</label>

     <div class="ratio">

      <input
       id="g${m}"
       type="number"
       min="0"
       value="${c.girl}"
      >

      <span>：</span>

      <input
       id="s${m}"
       type="number"
       min="0"
       value="${c.shop}"
      >

     </div>

    </div>

    <div class="muted">
     左＝女の子　右＝お店
    </div>

   </div>

   `;

  }).join("");


 document.getElementById("settingsModal")
  .classList.add("show");

}


function saveSettings(){

 const girls=[
  ...document.querySelectorAll(".girlName")
 ]
 .map(x=>x.value.trim())
 .filter(Boolean);

 if(!girls.length){
  alert("女の子を1人以上設定してください");
  return;
 }

 const names=new Set();

 for(const name of girls){

  if(names.has(name)){
   alert("同じ名前があります");
   return;
  }

  names.add(name);
 }

 const courses={};

 for(const m of courseMinutes){

  const price=Number(document.getElementById("p"+m).value||0);
  const girl=Number(document.getElementById("g"+m).value||0);
  const shop=Number(document.getElementById("s"+m).value||0);

  if(girl+shop<=0){
   alert(m+"分の取り分を設定してください");
   return;
  }

  courses[m]={price,girl,shop};

 }

 settings={girls,courses};

 localStorage.setItem(
  "shop_settings",
  JSON.stringify(settings)
 );

 closeModal("settingsModal");

 render();

 alert("設定を保存しました");

}


function addGirl(){

 const input=document.getElementById("newGirl");

 const name=input.value.trim();

 if(!name)return;

 if(settings.girls.includes(name)){
  alert("同じ名前があります");
  return;
 }

 settings.girls.push(name);

 input.value="";

 openSettings();

}


function removeGirl(index){

 if(settings.girls.length<=1){
  alert("女の子は1人以上必要です");
  return;
 }

 const name=settings.girls[index];

 if(!confirm(name+"を削除しますか？")){
  return;
 }

 settings.girls.splice(index,1);

 openSettings();

}


/* =========================
   日付
========================= */

function localDate(){

 const d=new Date();

 return d.getFullYear()+"-"+
  String(d.getMonth()+1).padStart(2,"0")+"-"+
  String(d.getDate()).padStart(2,"0");

}


function today(){

 document.getElementById("date").value=localDate();

 render();

}


/* =========================
   予約データ
========================= */

function reservationKey(){

 return "shop_reservations_"+
  document.getElementById("date").value;

}


function getReservations(){

 try{

  const data=localStorage.getItem(reservationKey());

  if(!data)return [];

  const parsed=JSON.parse(data);

  return Array.isArray(parsed)?parsed:[];

 }catch(e){

  return [];

 }

}


function setReservations(data){

 localStorage.setItem(
  reservationKey(),
  JSON.stringify(data)
 );

}


/* =========================
   時間
========================= */

function timeToMinutes(time){

 if(!time)return 0;

 const p=time.split(":");

 return Number(p[0])*60+Number(p[1]);

}


function minutesToTime(minutes){

 return String(Math.floor(minutes/60)).padStart(2,"0")+
  ":"+
  String(minutes%60).padStart(2,"0");

}


/* =========================
   重複チェック
========================= */

function isOverlapping(
 start,
 end,
 girl,
 reservations,
 excludeId=null
){

 return reservations.some(r=>{

  if(
   excludeId!==null &&
   String(r.id)===String(excludeId)
  ){
   return false;
  }

  if(r.girl!==girl){
   return false;
  }

  const oldStart=timeToMinutes(r.time);
  const oldEnd=oldStart+Number(r.course);

  return start<oldEnd && end>oldStart;

 });

}


/* =========================
   予約画面
========================= */

function openReserve(time,girl,id=null){

 selectedId=
  id===null?null:String(id);

 const title=document.getElementById("reserveTitle");

 title.textContent=
  selectedId?"予約編集":"予約";


 const girlSelect=document.getElementById("rGirl");

 girlSelect.innerHTML=
  settings.girls.map(g=>`

   <option value="${esc(g)}">
    ${esc(g)}
   </option>

  `).join("");


 const courseSelect=document.getElementById("rCourse");

 courseSelect.innerHTML=
  courseMinutes.map(m=>`

   <option value="${m}">
    ${m}分
   </option>

  `).join("");


 const reservations=getReservations();

 const old=selectedId
  ?reservations.find(
   r=>String(r.id)===String(selectedId)
  )
  :null;


 if(old){

  document.getElementById("rTime").value=old.time;
  girlSelect.value=old.girl;
  courseSelect.value=String(old.course);
  document.getElementById("rName").value=old.name||"";

 }else{

  document.getElementById("rTime").value=time;
  girlSelect.value=girl;
  courseSelect.value="40";
  document.getElementById("rName").value="";

 }


 document.getElementById("deleteBtn").style.display=
  selectedId?"block":"none";

 updateRInfo();

 document.getElementById("reserveModal")
  .classList.add("show");

}


/* =========================
   料金
========================= */

function updateRInfo(){

 const course=Number(
  document.getElementById("rCourse").value
 );

 const c=settings.courses[course];

 if(!c){
  document.getElementById("rInfo").textContent="";
  return;
 }

 const total=Number(c.girl)+Number(c.shop);

 const girlMoney=total>0
  ?Math.round(c.price*c.girl/total)
  :0;

 const shopMoney=c.price-girlMoney;

 document.getElementById("rInfo").textContent=
  "料金 "+
  c.price.toLocaleString()+"円 / 女の子 "+
  girlMoney.toLocaleString()+"円 / お店 "+
  shopMoney.toLocaleString()+"円（"+
  c.girl+":"+c.shop+"）";

}


document.getElementById("rCourse")
 .addEventListener("change",updateRInfo);


/* =========================
   予約保存
========================= */

function saveReservation(){

 const reservations=getReservations();

 const time=document.getElementById("rTime").value;
 const girl=document.getElementById("rGirl").value;
 const course=Number(document.getElementById("rCourse").value);
 const name=document.getElementById("rName").value.trim();

 if(!time){
  alert("時間を入力してください");
  return;
 }

 if(!girl){
  alert("女の子を選択してください");
  return;
 }

 if(!course){
  alert("コースを選択してください");
  return;
 }

 const start=timeToMinutes(time);
 const end=start+course;

 if(end>1440){
  alert("24:00を超える予約はできません");
  return;
 }

 if(
  isOverlapping(
   start,
   end,
   girl,
   reservations,
   selectedId
  )
 ){

  alert(
   "この時間はすでに予約が入っています。\n\n"+
   "同じ女の子の予約時間が重なっています。"
  );

  return;
 }


 const id=selectedId||Date.now().toString();

 const reservation={
  id:String(id),
  time:time,
  girl:girl,
  course:course,
  name:name
 };


 const index=reservations.findIndex(
  r=>String(r.id)===String(id)
 );


 if(index>=0){
  reservations[index]=reservation;
 }else{
  reservations.push(reservation);
 }


 reservations.sort(
  (a,b)=>
   timeToMinutes(a.time)-
   timeToMinutes(b.time)
 );


 setReservations(reservations);

 selectedId=null;

 closeModal("reserveModal");

 render();

}


/* =========================
   削除
========================= */

function deleteReservation(){

 if(selectedId===null){
  alert("削除する予約が選択されていません");
  return;
 }


 const reservations=getReservations();

 const target=reservations.find(
  r=>String(r.id)===String(selectedId)
 );


 if(!target){

  alert("予約データが見つかりません");

  selectedId=null;

  closeModal("reserveModal");

  render();

  return;
 }


 if(!confirm(
  "この予約を削除しますか？\n\n"+
  target.time+" / "+
  target.girl+" / "+
  target.course+"分"
 )){

  return;
 }


 const newReservations=reservations.filter(
  r=>String(r.id)!==String(selectedId)
 );


 setReservations(newReservations);

 selectedId=null;

 closeModal("reserveModal");

 render();

 alert("予約を削除しました");

}


/* =========================
   予約表
========================= */

function render(){

 const date=document.getElementById("date");

 if(!date.value){
  date.value=localDate();
 }


 const reservations=getReservations();

 let html="";

 html+=`
 <div
  class="schedule"
  style="--girls:${settings.girls.length}"
 >
 `;


 /* ヘッダー */

 html+=`
 <div class="cell head">時間</div>
 `;

 settings.girls.forEach(g=>{

  html+=`
  <div class="cell head">
   ${esc(g)}
  </div>
  `;

 });


 /*
  10分刻みの表示
  ただし、予約がその時間帯にある場合は
  その予約を表示する
 */

 for(
  let minutes=600;
  minutes<=1440;
  minutes+=10
 ){

  const slotStart=minutes;
  const slotEnd=minutes+10;

  if(minutes===1440)break;

  const displayTime=minutesToTime(minutes);


  html+=`
  <div class="cell time">
   ${displayTime}
  </div>
  `;


  settings.girls.forEach(girl=>{

   /*
    この10分枠にかかっている予約を探す
   */

   const reservation=reservations.find(r=>{

    if(r.girl!==girl)return false;

    const start=timeToMinutes(r.time);
    const end=start+Number(r.course);

    return start<slotEnd && end>slotStart;

   });


   /*
    予約がある場合
   */

   if(reservation){

    const reservationStart=
     timeToMinutes(reservation.time);

    /*
     予約開始位置、または
     10分刻みでは表示できない予約を
     最初にかかった枠へ表示
    */

    const isFirstVisibleSlot=
     !reservations.some(other=>{

      if(other===reservation)return false;
      if(other.girl!==girl)return false;

      const otherStart=timeToMinutes(other.time);
      const otherEnd=otherStart+Number(other.course);

      return otherStart<slotStart &&
             otherEnd>slotStart;

     });


    /*
     同じ予約を何行にも表示しない
    */

    if(
     reservationStart>=slotStart &&
     reservationStart<slotEnd
    ){

     html+=`

     <div class="cell">

      <button
       class="slot reserved"
       onclick="openReserve(
        '${esc(reservation.time)}',
        '${esc(reservation.girl)}',
        '${String(reservation.id)}'
       )"
      >

       <b>
        ${esc(reservation.time)}
        ${reservation.course}分
       </b>

       <small>
        ${esc(reservation.name||"予約")}
       </small>

       <small>
        タップで編集・削除
       </small>

      </button>

     </div>

     `;

    }else{

     html+=`

     <div class="cell">

      <button
       class="slot blocked"
       disabled
      >
       予約済み
      </button>

     </div>

     `;

    }

    return;

   }


   /*
    空いている枠
   */

   html+=`

   <div class="cell">

    <button
     class="slot"
     onclick="openReserve(
      '${displayTime}',
      '${esc(girl)}'
     )"
    >
     ＋予約
    </button>

   </div>

   `;

  });

 }


 html+="</div>";

 document.getElementById("schedule").innerHTML=html;

}


/* =========================
   集計
========================= */

function openSummary(){

 const reservations=getReservations();

 let total=0;
 let girlsTotal=0;
 let shopTotal=0;

 const byCourse={};
 const byGirl={};


 reservations.forEach(r=>{

  const c=settings.courses[r.course];

  if(!c)return;

  const price=Number(c.price)||0;

  const ratioTotal=
   Number(c.girl)+Number(c.shop);

  const girlMoney=ratioTotal>0
   ?Math.round(price*c.girl/ratioTotal)
   :0;

  const shopMoney=price-girlMoney;

  total+=price;
  girlsTotal+=girlMoney;
  shopTotal+=shopMoney;

  if(!byCourse[r.course]){
   byCourse[r.course]={
    count:0,
    sales:0,
    girl:0,
    shop:0
   };
  }

  byCourse[r.course].count++;
  byCourse[r.course].sales+=price;
  byCourse[r.course].girl+=girlMoney;
  byCourse[r.course].shop+=shopMoney;

  byGirl[r.girl]=
   (byGirl[r.girl]||0)+girlMoney;

 });


 let html=`

 <p>

 予約 <b>${reservations.length}件</b><br>

 売上 <b>${total.toLocaleString()}円</b><br>

 女の子合計 ${girlsTotal.toLocaleString()}円<br>

 お店合計 ${shopTotal.toLocaleString()}円

 </p>

 <h3>コース別</h3>

 <table>

 <tr>
  <th>コース</th>
  <th>件数</th>
  <th>売上</th>
  <th>女の子</th>
  <th>お店</th>
  <th>割合</th>
 </tr>
 `;


 courseMinutes.forEach(m=>{

  const x=byCourse[m]||{
   count:0,
   sales:0,
   girl:0,
   shop:0
  };

  const c=settings.courses[m];

  html+=`

  <tr>

   <td>${m}分</td>

   <td>${x.count}</td>

   <td>${x.sales.toLocaleString()}円</td>

   <td>${x.girl.toLocaleString()}円</td>

   <td>${x.shop.toLocaleString()}円</td>

   <td>${c.girl}:${c.shop}</td>

  </tr>

  `;

 });


 html+=`

 </table>

 <h3>女の子別</h3>

 <table>

 <tr>
  <th>名前</th>
  <th>取り分</th>
 </tr>
 `;


 settings.girls.forEach(g=>{

  html+=`

  <tr>

   <td>${esc(g)}</td>

   <td>
    ${(byGirl[g]||0).toLocaleString()}円
   </td>

  </tr>

  `;

 });


 html+="</table>";

 document.getElementById("summary").innerHTML=html;

 document.getElementById("summaryModal")
  .classList.add("show");

}

function closeModal(id){

 const modal=document.getElementById(id);

 if(modal){
  modal.classList.remove("show");
 }

}


/* =========================
   HTMLエスケープ
========================= */

function esc(value){

 return String(value??"")
  .replace(
   /[&<>"']/g,
   function(match){

    return({
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#39;"
    })[match];

   }
  );

}
