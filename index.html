<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>予約表</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

button,
input,
select{
  font:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:10px;
}

.header-row{
  display:flex;
  gap:6px;
  align-items:center;
  justify-content:space-between;
}

.date-box{
  display:flex;
  align-items:center;
  gap:6px;
}

.date-box input{
  width:145px;
  padding:8px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff;
}

.top-btn{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:#222;
  color:#fff;
}

.schedule{
  padding:10px;
}

.grid{
  display:grid;
  grid-template-columns:60px repeat(2,minmax(0,1fr));
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
}

.cell{
  min-height:58px;
  border-right:1px solid #ddd;
  border-bottom:1px solid #ddd;
  padding:5px;
}

.cell:nth-child(3n){
  border-right:0;
}

.header-cell{
  background:#fafafa;
  font-weight:bold;
  text-align:center;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.time-cell{
  color:#666;
  font-size:12px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding-top:8px;
}

.empty-btn{
  width:100%;
  min-height:45px;
  border:1px dashed #ccc;
  border-radius:7px;
  background:#fafafa;
  color:#777;
}

.unavailable-btn{
  width:100%;
  min-height:45px;
  border:1px solid #eee;
  border-radius:7px;
  background:#eee;
  color:#aaa;
  font-size:12px;
}

.reservation{
  width:100%;
  min-height:45px;
  border:0;
  border-radius:7px;
  background:#dff2ff;
  padding:5px;
  text-align:left;
}

.reservation .r-time{
  font-weight:bold;
  font-size:13px;
}

.reservation .r-info{
  font-size:11px;
  margin-top:2px;
}

.bottom-area{
  padding:10px;
}

.big-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  background:#222;
  color:#fff;
  margin-bottom:8px;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.5);
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:18px;
}

.modal h2{
  margin-top:0;
}

.form-row{
  margin-bottom:14px;
}

.form-row label{
  display:block;
  font-size:13px;
  color:#666;
  margin-bottom:5px;
}

.form-row input,
.form-row select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fff;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.modal-buttons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:8px;
}

.save-btn{
  background:#222;
  color:#fff;
}

.cancel-btn{
  background:#eee;
}

.delete-btn{
  background:#d9534f;
  color:#fff;
}

.list{
  margin-top:10px;
}

.list-item{
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.setting-girl{
  display:flex;
  gap:6px;
  margin-bottom:8px;
}

.setting-girl input{
  flex:1;
}

.small-btn{
  border:0;
  border-radius:7px;
  padding:7px 10px;
  background:#eee;
}

.course-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-bottom:7px;
}

.course-row input{
  width:100%;
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
}

.summary-box{
  background:#f7f7f7;
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
}

.notice{
  background:#fff7d6;
  border:1px solid #f0d875;
  border-radius:8px;
  padding:10px;
  font-size:13px;
  margin-bottom:12px;
}

@media(max-width:500px){
  .grid{
    grid-template-columns:55px repeat(2,minmax(0,1fr));
  }

  .cell{
    min-height:54px;
    padding:4px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="header-row">

    <div class="date-box">
      <button class="top-btn" onclick="changeDate(-1)">‹</button>
      <input type="date" id="dateInput" onchange="loadDate()">
      <button class="top-btn" onclick="changeDate(1)">›</button>
    </div>

    <div>
      <button class="top-btn" onclick="openSummary()">集計</button>
      <button class="top-btn" onclick="openSettings()">設定</button>
    </div>

  </div>
</div>


<div class="schedule">
  <div id="scheduleGrid" class="grid"></div>
</div>


<div class="bottom-area">
  <button class="big-btn" onclick="openNewReservation()">
    ＋ 新しい予約
  </button>

  <div id="reservationList" class="list"></div>
</div>


<!-- 予約モーダル -->

<div id="reservationModal" class="modal-bg">
  <div class="modal">

    <h2 id="reservationTitle">新しい予約</h2>

    <div class="notice">
      同じ女の子の予約は、前の予約が終わってから
      <strong>5分以上</strong>空ける必要があります。
    </div>

    <div class="form-row">
      <label>お客様名</label>
      <input id="customerInput" type="text" placeholder="例：田中様">
    </div>

    <div class="form-row">
      <label>女の子</label>
      <select id="girlInput"></select>
    </div>

    <div class="form-row">
      <label>開始時間</label>
      <input id="timeInput" type="time" min="10:00" max="23:59">
    </div>

    <div class="form-row">
      <label>コース</label>
      <select id="courseInput"></select>
    </div>

    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeReservationModal()">
        キャンセル
      </button>

      <button class="save-btn" onclick="saveReservation()">
        保存
      </button>
    </div>

    <div class="modal-buttons" id="deleteArea">
      <button class="delete-btn" onclick="deleteReservation()">
        この予約を削除
      </button>
    </div>

  </div>
</div>


<!-- 設定モーダル -->

<div id="settingsModal" class="modal-bg">
  <div class="modal">

    <h2>設定</h2>

    <h3>女の子</h3>

    <div id="girlsSettings"></div>

    <button class="small-btn" onclick="addGirl()">
      ＋ 女の子を追加
    </button>

    <h3>コース</h3>

    <div id="coursesSettings"></div>

    <button class="small-btn" onclick="addCourse()">
      ＋ コースを追加
    </button>

    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeSettings()">
        キャンセル
      </button>

      <button class="save-btn" onclick="saveSettings()">
        設定を保存
      </button>
    </div>

  </div>
</div>


<!-- 集計モーダル -->

<div id="summaryModal" class="modal-bg">
  <div class="modal">

    <h2>本日の集計</h2>

    <div id="summaryContent"></div>

    <div class="modal-buttons">
      <button class="cancel-btn" onclick="closeSummary()">
        閉じる
      </button>
    </div>

  </div>
</div>


<script>

const GRID_START_MINUTES = 10 * 60;
const GRID_END_MINUTES = 24 * 60;

/*
  ★★★ ここが重要 ★★★

  同じ女の子は予約終了から5分空ける。
*/
const REQUIRED_GAP_MINUTES = 5;


/* =========================
   設定
========================= */

const DEFAULT_SETTINGS = {
  girls: [
    "ことねさん",
    "ナヨンさん"
  ],

  courses: [
    {
      name:"40分",
      minutes:40,
      price:10000,
      share:0
    },
    {
      name:"60分",
      minutes:60,
      price:14000,
      share:0
    },
    {
      name:"90分",
      minutes:90,
      price:20000,
      share:0
    },
    {
      name:"100分",
      minutes:100,
      price:22000,
      share:0
    },
    {
      name:"120分",
      minutes:120,
      price:26000,
      share:0
    }
  ]
};


let settings =
  JSON.parse(localStorage.getItem("reservationSettings")) ||
  DEFAULT_SETTINGS;


let reservations = [];

let editingId = null;


/* =========================
   初期化
========================= */

document.addEventListener("DOMContentLoaded",function(){

  const today = new Date();

  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");

  document.getElementById("dateInput").value =
    `${yyyy}-${mm}-${dd}`;

  loadDate();

});


/* =========================
   日付
========================= */

function getSelectedDate(){

  return document.getElementById("dateInput").value;

}


function getStorageKey(){

  return "reservations_" + getSelectedDate();

}


function loadDate(){

  const data =
    localStorage.getItem(getStorageKey());

  reservations =
    data ? JSON.parse(data) : [];

  renderAll();

}


function saveData(){

  localStorage.setItem(
    getStorageKey(),
    JSON.stringify(reservations)
  );

}


function changeDate(days){

  const input =
    document.getElementById("dateInput");

  const date =
    new Date(input.value + "T00:00:00");

  date.setDate(date.getDate() + days);

  const yyyy = date.getFullYear();
  const mm = String(date.getMonth()+1).padStart(2,"0");
  const dd = String(date.getDate()).padStart(2,"0");

  input.value =
    `${yyyy}-${mm}-${dd}`;

  loadDate();

}


/* =========================
   時間
========================= */

function timeToMinutes(time){

  if(!time) return 0;

  const parts = time.split(":");

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );

}


function minutesToTime(minutes){

  const h =
    Math.floor(minutes / 60);

  const m =
    minutes % 60;

  return (
    String(h).padStart(2,"0") +
    ":" +
    String(m).padStart(2,"0")
  );

}


/* =========================
   予約重複チェック
========================= */

/*
  例：

  10:00〜11:00
  ↓
  11:00 ❌
  11:01 ❌
  11:04 ❌
  11:05 ⭕

  同じ女の子だけチェック。

  別の女の子なら同じ時間でもOK。
*/

function isOverlapping(
  girl,
  time,
  course,
  ignoreId
){

  const newStart =
    timeToMinutes(time);

  const newEnd =
    newStart + Number(course);


  return reservations.some(function(r){

    /*
      別の女の子なら無関係
    */
    if(r.girl !== girl){
      return false;
    }


    /*
      編集中の自分自身は無視
    */
    if(
      ignoreId !== null &&
      ignoreId !== undefined &&
      String(r.id) === String(ignoreId)
    ){
      return false;
    }


    const existingStart =
      timeToMinutes(r.time);

    const existingEnd =
      existingStart + Number(r.course);


    /*
      ★★★★★
      ここが5分ルール

      新しい予約開始時間が
      既存予約の終了＋5分より前ならNG。

      また、

      新しい予約終了時間＋5分が
      既存予約開始より後ならNG。

      つまり両方向から重複を確認する。
    */
    const newStartTooEarly =
      newStart < existingEnd + REQUIRED_GAP_MINUTES;

    const newEndTooLate =
      newEnd + REQUIRED_GAP_MINUTES > existingStart;


    return (
      newStartTooEarly &&
      newEndTooLate
    );

  });

}


/* =========================
   予約開始可能時間チェック
========================= */

/*
  10分刻みの表で、

  10:00〜11:00の予約がある場合

  11:00
  ↓
  「予約不可」

  と表示するためのチェック。

  保存時のチェックとは別に、
  表側でも予約できない場所を表示する。
*/

function canStartReservationAt(
  girl,
  time
){

  const start =
    timeToMinutes(time);


  return !reservations.some(function(r){

    if(r.girl !== girl){
      return false;
    }


    const existingStart =
      timeToMinutes(r.time);

    const existingEnd =
      existingStart + Number(r.course);


    /*
      既存予約の

      開始−5分

      から

      終了＋5分

      までの範囲は
      新しい予約開始不可。
    */

    return (
      start >= existingStart - REQUIRED_GAP_MINUTES &&
      start < existingEnd + REQUIRED_GAP_MINUTES
    );

  });

}


/* =========================
   24時チェック
========================= */

function exceedsEndOfDay(
  time,
  course
){

  const start =
    timeToMinutes(time);

  const end =
    start + Number(course);

  return end > GRID_END_MINUTES;

}


/* =========================
   予約入力を開く
========================= */

function openNewReservation(
  presetTime = "",
  presetGirl = ""
){

  editingId = null;

  document.getElementById(
    "reservationTitle"
  ).textContent = "新しい予約";


  document.getElementById(
    "customerInput"
  ).value = "";


  fillGirlSelect();


  fillCourseSelect();


  document.getElementById(
    "timeInput"
  ).value =
    presetTime || "10:00";


  if(presetGirl){

    document.getElementById(
      "girlInput"
    ).value =
      presetGirl;

  }


  document.getElementById(
    "deleteArea"
  ).style.display = "none";


  document
    .getElementById("reservationModal")
    .classList.add("show");

}


/* =========================
   編集
========================= */

function openEditReservation(id){

  const r =
    reservations.find(function(x){
      return String(x.id) === String(id);
    });


  if(!r){
    return;
  }


  editingId = r.id;


  document.getElementById(
    "reservationTitle"
  ).textContent = "予約を編集";


  document.getElementById(
    "customerInput"
  ).value =
    r.customer || "";


  fillGirlSelect();


  fillCourseSelect();


  document.getElementById(
    "girlInput"
  ).value =
    r.girl;


  document.getElementById(
    "timeInput"
  ).value =
    r.time;


  document.getElementById(
    "courseInput"
  ).value =
    String(r.course);


  document.getElementById(
    "deleteArea"
  ).style.display = "flex";


  document
    .getElementById("reservationModal")
    .classList.add("show");

}


/* =========================
   女の子選択
========================= */

function fillGirlSelect(){

  const select =
    document.getElementById("girlInput");

  select.innerHTML = "";


  settings.girls.forEach(function(girl){

    const option =
      document.createElement("option");

    option.value = girl;
    option.textContent = girl;

    select.appendChild(option);

  });

}


/* =========================
   コース選択
========================= */

function fillCourseSelect(){

  const select =
    document.getElementById("courseInput");

  select.innerHTML = "";


  settings.courses.forEach(function(course){

    const option =
      document.createElement("option");

    option.value =
      course.minutes;

    option.textContent =
      course.name;

    select.appendChild(option);

  });

}


/* =========================
   保存
========================= */

function saveReservation(){

  const customer =
    document.getElementById(
      "customerInput"
    ).value.trim();


  const girl =
    document.getElementById(
      "girlInput"
    ).value;


  const time =
    document.getElementById(
      "timeInput"
    ).value;


  const course =
    Number(
      document.getElementById(
        "courseInput"
      ).value
    );


  if(!girl){

    alert("女の子を選択してください。");
    return;

  }


  if(!time){

    alert("開始時間を入力してください。");
    return;

  }


  if(!course){

    alert("コースを選択してください。");
    return;

  }


  const start =
    timeToMinutes(time);


  if(start < GRID_START_MINUTES){

    alert("10:00以降で入力してください。");
    return;

  }


  if(exceedsEndOfDay(time,course)){

    alert(
      "24:00を超える予約はできません。"
    );

    return;

  }


  /*
    ★★★★★
    保存時に必ず5分ルールをチェック
  */

  if(
    isOverlapping(
      girl,
      time,
      course,
      editingId
    )
  ){

    alert(
      "同じ女の子の予約とは5分以上空けてください。\n\n" +
      "予約終了から5分後より予約できます。"
    );

    return;

  }


  const reservation = {

    id:
      editingId !== null
        ? editingId
        : Date.now(),

    customer:
      customer,

    girl:
      girl,

    time:
      time,

    course:
      course

  };


  if(editingId !== null){

    const index =
      reservations.findIndex(function(r){

        return String(r.id) === String(editingId);

      });


    if(index !== -1){

      reservations[index] =
        reservation;

    }

  }else{

    reservations.push(
      reservation
    );

  }


  reservations.sort(function(a,b){

    return (
      timeToMinutes(a.time) -
      timeToMinutes(b.time)
    );

  });


  saveData();

  closeReservationModal();

  renderAll();

}


/* =========================
   削除
========================= */

function deleteReservation(){

  if(editingId === null){
    return;
  }


  const r =
    reservations.find(function(x){

      return String(x.id) === String(editingId);

    });


  if(!r){
    return;
  }


  const ok =
    confirm(
      "この予約を削除しますか？\n\n" +
      r.time +
      " " +
      r.girl
    );


  if(!ok){
    return;
  }


  reservations =
    reservations.filter(function(x){

      return String(x.id) !== String(editingId);

    });


  saveData();

  closeReservationModal();

  renderAll();

}


/* =========================
   モーダル閉じる
========================= */

function closeReservationModal(){

  document
    .getElementById("reservationModal")
    .classList.remove("show");

  editingId = null;

}


/* =========================
   予約表
========================= */

function renderSchedule(){

  const grid =
    document.getElementById(
      "scheduleGrid"
    );


  grid.innerHTML = "";


  /*
    ヘッダー
  */

  const blank =
    document.createElement("div");

  blank.className =
    "cell header-cell";

  blank.textContent =
    "時間";

  grid.appendChild(blank);


  settings.girls.forEach(function(girl){

    const cell =
      document.createElement("div");

    cell.className =
      "cell header-cell";

    cell.textContent =
      girl;

    grid.appendChild(cell);

  });


  /*
    現在の設定では2人用
    なので、CSSも2列。
  */

  for(
    let minute = GRID_START_MINUTES;
    minute < GRID_END_MINUTES;
    minute += 10
  ){

    const time =
      minutesToTime(minute);


    /*
      時間
    */

    const timeCell =
      document.createElement("div");

    timeCell.className =
      "cell time-cell";

    timeCell.textContent =
      time;

    grid.appendChild(timeCell);


    /*
      女の子ごと
    */

    settings.girls.forEach(function(girl){

      const cell =
        document.createElement("div");

      cell.className =
        "cell";


      /*
        この10分枠に
        表示する予約を探す。

        10:05の予約なら
        10:00の行に表示する。
      */

      const reservation =
        reservations.find(function(r){

          if(r.girl !== girl){
            return false;
          }

          const reservationStart =
            timeToMinutes(r.time);

          const reservationEnd =
            reservationStart +
            Number(r.course);


          return (
            minute >=
              Math.floor(
                reservationStart / 10
              ) * 10
            &&
            minute <
              reservationEnd
          );

        });


      if(reservation){

        const button =
          document.createElement("button");

        button.className =
          "reservation";


        const startText =
          reservation.time;


        const customerText =
          reservation.customer
            ? reservation.customer
            : "お客様";


        button.innerHTML =
          "<div class='r-time'>" +
          startText +
          "〜" +
          minutesToTime(
            timeToMinutes(
              reservation.time
            ) +
            Number(reservation.course)
          ) +
          "</div>" +

          "<div class='r-info'>" +
          customerText +
          " / " +
          reservation.course +
          "分" +
          "</div>";


        button.onclick =
          function(){

            openEditReservation(
              reservation.id
            );

          };


        cell.appendChild(button);


      }else{

        /*
          ★★★★★
          ここでも5分ルールを確認。

          例えば

          10:00〜11:00
          ↓
          11:00

          は予約不可表示。

          11:05以降は予約可能。
        */

        const available =
          canStartReservationAt(
            girl,
            time
          );


        if(available){

          const button =
            document.createElement("button");

          button.className =
            "empty-btn";

          button.textContent =
            "＋ 予約";


          button.onclick =
            function(){

              openNewReservation(
                time,
                girl
              );

            };


          cell.appendChild(button);

        }else{

          const button =
            document.createElement("button");

          button.className =
            "unavailable-btn";

          button.textContent =
            "予約不可";


          /*
            クリックしても
            何も起こらない。
          */

          button.disabled =
            true;


          cell.appendChild(button);

        }

      }


      grid.appendChild(cell);

    });

  }

}


/* =========================
   予約一覧
========================= */

function renderReservationList(){

  const list =
    document.getElementById(
      "reservationList"
    );


  list.innerHTML = "";


  if(reservations.length === 0){

    list.innerHTML =
      "<div class='list-item'>" +
      "予約はありません。" +
      "</div>";

    return;

  }


  reservations.forEach(function(r){

    const item =
      document.createElement("div");

    item.className =
      "list-item";


    const end =
      minutesToTime(
        timeToMinutes(r.time) +
        Number(r.course)
      );


    item.innerHTML =
      "<strong>" +
      r.time +
      "〜" +
      end +
      "</strong><br>" +

      r.girl +
      "<br>" +

      (r.customer
        ? r.customer
        : "お客様") +

      " / " +
      r.course +
      "分";


    item.onclick =
      function(){

        openEditReservation(r.id);

      };


    list.appendChild(item);

  });

}


/* =========================
   全体更新
========================= */

function renderAll(){

  renderSchedule();

  renderReservationList();

}


/* =========================
   設定
========================= */

function openSettings(){

  renderSettings();

  document
    .getElementById("settingsModal")
    .classList.add("show");

}


function closeSettings(){

  document
    .getElementById("settingsModal")
    .classList.remove("show");

}


function renderSettings(){

  const girls =
    document.getElementById(
      "girlsSettings"
    );


  girls.innerHTML = "";


  settings.girls.forEach(function(girl,index){

    const row =
      document.createElement("div");

    row.className =
      "setting-girl";


    row.innerHTML =
      "<input type='text' " +
      "value='" +
      escapeHtml(girl) +
      "' " +
      "data-girl-index='" +
      index +
      "'>" +

      "<button class='small-btn' " +
      "onclick='removeGirl(" +
      index +
      ")'>" +
      "削除" +
      "</button>";


    girls.appendChild(row);

  });


  const courses =
    document.getElementById(
      "coursesSettings"
    );


  courses.innerHTML = "";


  settings.courses.forEach(function(course,index){

    const row =
      document.createElement("div");

    row.className =
      "course-row";


    row.innerHTML =
      "<input type='text' " +
      "value='" +
      escapeHtml(course.name) +
      "' " +
      "data-course-name='" +
      index +
      "'>" +

      "<input type='number' " +
      "value='" +
      course.minutes +
      "' " +
      "data-course-minutes='" +
      index +
      "'>" +

      "<input type='number' " +
      "value='" +
      course.price +
      "' " +
      "data-course-price='" +
      index +
      "'>";


    courses.appendChild(row);

  });

}


function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function addGirl(){

  settings.girls.push(
    "新しい女の子"
  );

  renderSettings();

}


function removeGirl(index){

  if(settings.girls.length <= 1){

    alert(
      "女の子は1人以上必要です。"
    );

    return;

  }


  settings.girls.splice(index,1);

  renderSettings();

}


function addCourse(){

  settings.courses.push({

    name:"新コース",
    minutes:60,
    price:0,
    share:0

  });


  renderSettings();

}


function saveSettings(){

  const girlInputs =
    document.querySelectorAll(
      "[data-girl-index]"
    );


  const newGirls = [];


  girlInputs.forEach(function(input){

    const value =
      input.value.trim();

    if(value){

      newGirls.push(value);

    }

  });


  if(newGirls.length === 0){

    alert(
      "女の子を1人以上設定してください。"
    );

    return;

  }


  settings.girls =
    newGirls;


  const courseNameInputs =
    document.querySelectorAll(
      "[data-course-name]"
    );

  const courseMinutesInputs =
    document.querySelectorAll(
      "[data-course-minutes]"
    );

  const coursePriceInputs =
    document.querySelectorAll(
      "[data-course-price]"
    );


  const newCourses = [];


  for(
    let i=0;
    i<courseNameInputs.length;
    i++
  ){

    const name =
      courseNameInputs[i]
        .value
        .trim();


    const minutes =
      Number(
        courseMinutesInputs[i].value
      );


    const price =
      Number(
        coursePriceInputs[i].value
      );


    if(
      name &&
      minutes > 0
    ){

      newCourses.push({

        name:name,

        minutes:minutes,

        price:
          price || 0,

        share:0

      });

    }

  }


  if(newCourses.length === 0){

    alert(
      "コースを1つ以上設定してください。"
    );

    return;

  }


  settings.courses =
    newCourses;


  localStorage.setItem(
    "reservationSettings",
    JSON.stringify(settings)
  );


  closeSettings();

  renderAll();

}


/* =========================
   集計
========================= */

function openSummary(){

  const content =
    document.getElementById(
      "summaryContent"
    );


  content.innerHTML = "";


  let totalSales = 0;


  settings.girls.forEach(function(girl){

    const girlReservations =
      reservations.filter(function(r){

        return r.girl === girl;

      });


    let sales = 0;


    girlReservations.forEach(function(r){

      const course =
        settings.courses.find(function(c){

          return Number(c.minutes) ===
            Number(r.course);

        });


      if(course){

        sales +=
          Number(course.price || 0);

      }

    });


    totalSales += sales;


    const box =
      document.createElement("div");

    box.className =
      "summary-box";


    box.innerHTML =
      "<strong>" +
      escapeHtml(girl) +
      "</strong><br>" +

      "予約数：" +
      girlReservations.length +
      "件<br>" +

      "売上：" +
      sales.toLocaleString() +
      "円";


    content.appendChild(box);

  });


  const total =
    document.createElement("div");

  total.className =
    "summary-box";


  total.innerHTML =
    "<strong>合計</strong><br>" +

    "予約数：" +
    reservations.length +
    "件<br>" +

    "売上：" +
    totalSales.toLocaleString() +
    "円";


  content.appendChild(total);


  document
    .getElementById("summaryModal")
    .classList.add("show");

}


function closeSummary(){

  document
    .getElementById("summaryModal")
    .classList.remove("show");

}


/* =========================
   画面外タップで閉じる
========================= */

document
  .getElementById("reservationModal")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target ===
        this
      ){

        closeReservationModal();

      }

    }
  );


document
  .getElementById("settingsModal")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target ===
        this
      ){

        closeSettings();

      }

    }
  );


document
  .getElementById("summaryModal")
  .addEventListener(
    "click",
    function(e){

      if(
        e.target ===
        this
      ){

        closeSummary();

      }

    }
  );

</script>
