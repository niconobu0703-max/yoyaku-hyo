<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>予約表</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:10px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

h1{
  font-size:20px;
  margin:0;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 12px;
  font-size:14px;
  cursor:pointer;
}

.primary{
  background:#222;
  color:#fff;
}

.secondary{
  background:#e9eaed;
  color:#222;
}

.danger{
  background:#e53935;
  color:#fff;
}

.container{
  padding:10px;
  overflow-x:auto;
}

.date-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.date-row input{
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

.table-wrap{
  background:#fff;
  border-radius:10px;
  overflow:auto;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:700px;
}

th,
td{
  border:1px solid #ddd;
  padding:0;
  text-align:center;
}

th{
  background:#f0f1f3;
  height:42px;
  position:sticky;
  top:0;
  z-index:10;
}

.time-cell{
  width:70px;
  min-width:70px;
  background:#fafafa;
  font-weight:bold;
  font-size:13px;
}

.slot{
  height:55px;
  min-width:150px;
  position:relative;
  background:#fff;
}

.slot.available{
  cursor:pointer;
}

.slot.available:hover{
  background:#f4f8ff;
}

.slot.unavailable{
  background:#eee;
  color:#999;
}

.add-text{
  color:#aaa;
  font-size:12px;
}

.reservation{
  margin:3px;
  min-height:48px;
  border-radius:7px;
  padding:5px 6px;
  background:#dff1ff;
  border:1px solid #8bc8ef;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
}

.reservation strong{
  display:block;
  font-size:13px;
}

.reservation small{
  display:block;
  font-size:11px;
  margin-top:2px;
}

.modal-back{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}

.modal-back.show{
  display:flex;
}

.modal{
  background:#fff;
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:18px;
}

.modal h2{
  margin:0 0 15px;
  font-size:19px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.field input,
.field select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
  background:#fff;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.modal-buttons button{
  flex:1;
}

.setting-section{
  margin-bottom:22px;
}

.setting-section h3{
  margin:0 0 10px;
  font-size:16px;
}

.setting-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  margin-bottom:8px;
  align-items:center;
}

.setting-row.course{
  grid-template-columns:1fr 90px 110px auto;
}

.setting-row input{
  min-width:0;
  padding:9px;
  border:1px solid #ccc;
  border-radius:7px;
}

.add-row{
  margin-top:8px;
}

.summary-table{
  width:100%;
  border-collapse:collapse;
}

.summary-table th,
.summary-table td{
  padding:8px;
  border:1px solid #ddd;
}

.summary-table th{
  background:#f2f3f5;
  position:static;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
  text-align:right;
}

.empty{
  padding:20px;
  text-align:center;
  color:#888;
}

.notice{
  padding:10px;
  background:#fff7d6;
  border:1px solid #f0d36a;
  border-radius:8px;
  margin-bottom:10px;
  font-size:13px;
}

@media(max-width:700px){
  .setting-row.course{
    grid-template-columns:1fr 75px 95px auto;
  }

  .setting-row input{
    font-size:13px;
  }

  button{
    padding:8px 10px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <h1>予約表</h1>

    <div style="display:flex;gap:6px;">
      <button class="secondary" id="summaryBtn">集計</button>
      <button class="secondary" id="settingsBtn">設定</button>
    </div>
  </div>
</header>

<div class="container">

  <div class="date-row">
    <input type="date" id="dateInput">
    <button class="secondary" id="todayBtn">今日</button>
  </div>

  <div class="notice">
    予約時間は1分単位で入力できます。<br>
    他の予約と実際に時間が重なる場合のみ予約できません。
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="time-cell">時間</th>
          <th id="girlHeader0">---</th>
          <th id="girlHeader1">---</th>
        </tr>
      </thead>
      <tbody id="reservationBody"></tbody>
    </table>
  </div>

</div>


<!-- 予約モーダル -->
<div class="modal-back" id="reservationModal">
  <div class="modal">

    <h2 id="reservationTitle">予約登録</h2>

    <div class="field">
      <label>女の子</label>
      <select id="reservationGirl"></select>
    </div>

    <div class="field">
      <label>開始時間</label>
      <input type="time" id="reservationTime" step="60">
    </div>

    <div class="field">
      <label>コース</label>
      <select id="reservationCourse"></select>
    </div>

    <div class="field">
      <label>お客様名</label>
      <input type="text" id="customerName" placeholder="お客様名">
    </div>

    <div class="field">
      <label>電話番号</label>
      <input type="tel" id="customerPhone" placeholder="電話番号">
    </div>

    <div class="field">
      <label>メモ</label>
      <input type="text" id="reservationMemo" placeholder="メモ">
    </div>

    <div class="modal-buttons">
      <button class="secondary" id="cancelReservationBtn">キャンセル</button>
      <button class="danger" id="deleteReservationBtn" style="display:none;">削除</button>
      <button class="primary" id="saveReservationBtn">保存</button>
    </div>

  </div>
</div>


<!-- 設定モーダル -->
<div class="modal-back" id="settingsModal">
  <div class="modal">

    <h2>設定</h2>

    <div class="setting-section">
      <h3>女の子</h3>

      <div id="girlsSettings"></div>

      <button class="secondary add-row" id="addGirlBtn">
        ＋ 女の子を追加
      </button>
    </div>

    <div class="setting-section">
      <h3>コース</h3>

      <div id="coursesSettings"></div>

      <button class="secondary add-row" id="addCourseBtn">
        ＋ コースを追加
      </button>
    </div>

    <div class="modal-buttons">
      <button class="secondary" id="cancelSettingsBtn">閉じる</button>
      <button class="primary" id="saveSettingsBtn">設定を保存</button>
    </div>

  </div>
</div>


<!-- 集計モーダル -->
<div class="modal-back" id="summaryModal">
  <div class="modal">

    <h2>売上・予約集計</h2>

    <div id="summaryContent"></div>

    <div class="modal-buttons">
      <button class="primary" id="closeSummaryBtn">閉じる</button>
    </div>

  </div>
</div>


<script>

const SETTINGS_KEY = "yoyaku_settings_final_v11";
const RES_PREFIX = "yoyaku_reservations_final_v11_";

const OPEN_HOUR = 10;
const CLOSE_HOUR = 24;


/* =========================
   初期設定
========================= */

const DEFAULT_SETTINGS = {
  girls:[
    "ことねさん",
    "ナヨンさん"
  ],

  courses:[
    {
      name:"40分",
      minutes:40,
      price:10000
    },
    {
      name:"60分",
      minutes:60,
      price:14000
    },
    {
      name:"90分",
      minutes:90,
      price:20000
    },
    {
      name:"100分",
      minutes:100,
      price:22000
    },
    {
      name:"120分",
      minutes:120,
      price:26000
    }
  ]
};


let settings = loadSettings();

let currentEditId = null;


/* =========================
   共通
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function pad(n){
  return String(n).padStart(2,"0");
}


function todayString(){

  const d = new Date();

  return d.getFullYear()
    + "-"
    + pad(d.getMonth()+1)
    + "-"
    + pad(d.getDate());

}


function timeToMinutes(time){

  const [h,m] = time.split(":").map(Number);

  return h * 60 + m;

}


function minutesToTime(minutes){

  const h = Math.floor(minutes / 60);

  const m = minutes % 60;

  return pad(h) + ":" + pad(m);

}


function dateKey(){

  return document.getElementById("dateInput").value;

}


/* =========================
   設定読み込み
========================= */

function loadSettings(){

  try{

    const saved = localStorage.getItem(SETTINGS_KEY);

    if(!saved){

      return structuredClone(DEFAULT_SETTINGS);

    }

    const data = JSON.parse(saved);

    if(!Array.isArray(data.girls) || data.girls.length === 0){

      data.girls = structuredClone(DEFAULT_SETTINGS.girls);

    }

    if(!Array.isArray(data.courses) || data.courses.length === 0){

      data.courses = structuredClone(DEFAULT_SETTINGS.courses);

    }

    return data;

  }catch(e){

    return structuredClone(DEFAULT_SETTINGS);

  }

}


function saveSettingsToStorage(){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify(settings)
  );

}


/* =========================
   予約データ
========================= */

function reservationKey(){

  return RES_PREFIX + dateKey();

}


function loadReservations(){

  try{

    const data = localStorage.getItem(reservationKey());

    if(!data) return [];

    const reservations = JSON.parse(data);

    return Array.isArray(reservations)
      ? reservations
      : [];

  }catch(e){

    return [];

  }

}


function saveReservations(reservations){

  localStorage.setItem(
    reservationKey(),
    JSON.stringify(reservations)
  );

}


/* =========================
   予約時間の重複チェック
========================= */

/*
   ここが今回の重要ポイント。

   10:40の予約があっても、
   10:41だから即NGということにはしない。

   実際のコース終了時間まで重なる場合だけNG。

   例：

   10:40～11:20
   10:41～11:21

   → 重なるのでNG

   10:40～11:20
   11:20～12:00

   → ちょうど接しているだけなのでOK
*/

function isOverlapping(startA,endA,startB,endB){

  return startA < endB && startB < endA;

}


function isAvailable(girl,time,courseMinutes,excludeId=null){

  const start = timeToMinutes(time);

  const end = start + Number(courseMinutes);

  const reservations = loadReservations();

  for(const r of reservations){

    if(r.id === excludeId) continue;

    if(r.girl !== girl) continue;

    const rStart = timeToMinutes(r.time);

    const rEnd = rStart + Number(r.minutes);

    if(
      isOverlapping(
        start,
        end,
        rStart,
        rEnd
      )
    ){

      return false;

    }

  }

  return true;

}


/* =========================
   営業時間
========================= */

function isWithinBusinessHours(time,minutes){

  const start = timeToMinutes(time);

  const end = start + Number(minutes);

  const open = OPEN_HOUR * 60;

  const close = CLOSE_HOUR * 60;

  return start >= open && end <= close;

}


/* =========================
   表示
========================= */

function render(){

  const body =
    document.getElementById("reservationBody");

  body.innerHTML = "";

  document.getElementById("girlHeader0").textContent =
    settings.girls[0] || "---";

  document.getElementById("girlHeader1").textContent =
    settings.girls[1] || "---";


  /*
    女の子が2人より多い場合、
    ヘッダーを作り直す
  */

  const headRow =
    document.querySelector("thead tr");

  while(headRow.children.length > 1){

    headRow.removeChild(headRow.lastElementChild);

  }

  settings.girls.forEach(girl=>{

    const th = document.createElement("th");

    th.textContent = girl;

    headRow.appendChild(th);

  });


  const reservations = loadReservations();


  /*
    表は10分刻みで表示
    ただし予約そのものは1分単位
  */

  for(
    let minutes = OPEN_HOUR * 60;
    minutes < CLOSE_HOUR * 60;
    minutes += 10
  ){

    const tr = document.createElement("tr");

    const timeTd = document.createElement("td");

    timeTd.className = "time-cell";

    timeTd.textContent = minutesToTime(minutes);

    tr.appendChild(timeTd);


    settings.girls.forEach(girl=>{

      const td = document.createElement("td");

      td.className = "slot";


      /*
        この10分の表示位置に、
        その時間を開始時間とする予約があるか
      */

      const reservation =
        reservations.find(r =>
          r.girl === girl &&
          timeToMinutes(r.time) === minutes
        );


      if(reservation){

        const card =
          document.createElement("div");

        card.className = "reservation";

        card.innerHTML =
          "<strong>"
          + escapeHtml(reservation.time)
          + "～"
          + escapeHtml(
              minutesToTime(
                timeToMinutes(reservation.time)
                + Number(reservation.minutes)
              )
            )
          + "</strong>"
          + "<small>"
          + escapeHtml(reservation.courseName)
          + "</small>"
          + (
            reservation.customerName
              ? "<small>"
                + escapeHtml(reservation.customerName)
                + "</small>"
              : ""
          );

        card.onclick = () =>
          openEdit(reservation.id);

        td.appendChild(card);

      }else{

        /*
          表示時間が予約中の時間帯なら
          「予約不可」にする
        */

        const busy =
          reservations.find(r => {

            if(r.girl !== girl) return false;

            const rStart =
              timeToMinutes(r.time);

            const rEnd =
              rStart + Number(r.minutes);

            return (
              minutes >= rStart &&
              minutes < rEnd
            );

          });


        if(busy){

          td.classList.add("unavailable");

          td.textContent = "予約中";

        }else{

          td.classList.add("available");

          const span =
            document.createElement("span");

          span.className = "add-text";

          span.textContent = "＋予約";

          td.appendChild(span);

          td.onclick = () =>
            openNew(girl,minutesToTime(minutes));

        }

      }


      tr.appendChild(td);

    });


    body.appendChild(tr);

  }

}


/* =========================
   予約登録
========================= */

function fillReservationSelects(){

  const girlSelect =
    document.getElementById("reservationGirl");

  const courseSelect =
    document.getElementById("reservationCourse");


  girlSelect.innerHTML = "";

  settings.girls.forEach((girl,index)=>{

    const option =
      document.createElement("option");

    option.value = index;

    option.textContent = girl;

    girlSelect.appendChild(option);

  });


  courseSelect.innerHTML = "";

  settings.courses.forEach((course,index)=>{

    const option =
      document.createElement("option");

    option.value = index;

    option.textContent =
      course.name
      + "　¥"
      + Number(course.price).toLocaleString();

    courseSelect.appendChild(option);

  });

}


function openNew(girl,time){

  currentEditId = null;

  fillReservationSelects();

  document.getElementById("reservationTitle")
    .textContent = "予約登録";

  document.getElementById("reservationGirl").value =
    String(settings.girls.indexOf(girl));

  document.getElementById("reservationTime").value =
    time;

  document.getElementById("reservationCourse").value =
    "0";

  document.getElementById("customerName").value =
    "";

  document.getElementById("customerPhone").value =
    "";

  document.getElementById("reservationMemo").value =
    "";

  document.getElementById("deleteReservationBtn")
    .style.display = "none";

  document.getElementById("reservationModal")
    .classList.add("show");

}


function openEdit(id){

  const reservations =
    loadReservations();

  const r =
    reservations.find(x => x.id === id);

  if(!r) return;

  currentEditId = id;

  fillReservationSelects();

  document.getElementById("reservationTitle")
    .textContent = "予約編集";

  document.getElementById("reservationGirl").value =
    String(settings.girls.indexOf(r.girl));

  document.getElementById("reservationTime").value =
    r.time;

  const courseIndex =
    settings.courses.findIndex(
      c =>
        c.name === r.courseName &&
        Number(c.minutes) === Number(r.minutes)
    );

  document.getElementById("reservationCourse").value =
    courseIndex >= 0
      ? String(courseIndex)
      : "0";

  document.getElementById("customerName").value =
    r.customerName || "";

  document.getElementById("customerPhone").value =
    r.customerPhone || "";

  document.getElementById("reservationMemo").value =
    r.memo || "";

  document.getElementById("deleteReservationBtn")
    .style.display = "block";

  document.getElementById("reservationModal")
    .classList.add("show");

}


function closeReservationModal(){

  document.getElementById("reservationModal")
    .classList.remove("show");

  currentEditId = null;

}


function saveReservation(){

  const girlIndex =
    Number(
      document.getElementById("reservationGirl").value
    );

  const courseIndex =
    Number(
      document.getElementById("reservationCourse").value
    );

  const girl =
    settings.girls[girlIndex];

  const course =
    settings.courses[courseIndex];

  const time =
    document.getElementById("reservationTime").value;

  const customerName =
    document.getElementById("customerName").value.trim();

  const customerPhone =
    document.getElementById("customerPhone").value.trim();

  const memo =
    document.getElementById("reservationMemo").value.trim();


  if(!girl){

    alert("女の子を選択してください。");

    return;

  }


  if(!course){

    alert("コースを選択してください。");

    return;

  }


  if(!time){

    alert("開始時間を入力してください。");

    return;

  }


  if(!isWithinBusinessHours(time,course.minutes)){

    alert(
      "営業時間外です。\n"
      + "10:00～24:00の範囲で入力してください。"
    );

    return;

  }


  /*
    実際に時間が重なる場合のみNG
  */

  if(
    !isAvailable(
      girl,
      time,
      course.minutes,
      currentEditId
    )
  ){

    alert(
      "この時間は他の予約と重なっています。\n"
      + "時間を変更してください。"
    );

    return;

  }


  const reservations =
    loadReservations();


  if(currentEditId){

    const index =
      reservations.findIndex(
        r => r.id === currentEditId
      );

    if(index >= 0){

      reservations[index] = {

        ...reservations[index],

        girl:girl,

        time:time,

        courseName:course.name,

        minutes:Number(course.minutes),

        price:Number(course.price),

        customerName:customerName,

        customerPhone:customerPhone,

        memo:memo

      };

    }

  }else{

    reservations.push({

      id:
        Date.now().toString()
        + "_"
        + Math.random()
          .toString(36)
          .slice(2),

      girl:girl,

      time:time,

      courseName:course.name,

      minutes:Number(course.minutes),

      price:Number(course.price),

      customerName:customerName,

      customerPhone:customerPhone,

      memo:memo

    });

  }


  saveReservations(reservations);

  closeReservationModal();

  render();

}


/* =========================
   予約削除
========================= */

function deleteReservation(){

  if(!currentEditId) return;

  if(!confirm("この予約を削除しますか？")){

    return;

  }


  let reservations =
    loadReservations();

  reservations =
    reservations.filter(
      r => r.id !== currentEditId
    );

  saveReservations(reservations);

  closeReservationModal();

  render();

}


/* =========================
   設定画面
========================= */

function renderSettings(){

  const girlsBox =
    document.getElementById("girlsSettings");

  const coursesBox =
    document.getElementById("coursesSettings");


  girlsBox.innerHTML = "";

  settings.girls.forEach((girl,index)=>{

    const row =
      document.createElement("div");

    row.className = "setting-row";

    row.innerHTML =
      '<input '
      + 'data-gname="'
      + index
      + '" '
      + 'value="'
      + escapeHtml(girl)
      + '" '
      + 'placeholder="女の子の名前">'
      + '<button '
      + 'type="button" '
      + 'class="danger" '
      + 'data-rmgirl="'
      + index
      + '">削除</button>';

    girlsBox.appendChild(row);

  });


  girlsBox
    .querySelectorAll("[data-rmgirl]")
    .forEach(button=>{

      button.onclick = ()=>{

        syncGirlInputs();

        const index =
          Number(button.dataset.rmgirl);

        if(settings.girls.length <= 1){

          alert(
            "女の子は最低1人必要です。"
          );

          return;

        }


        if(
          !confirm(
            settings.girls[index]
            + "を削除しますか？"
          )
        ){

          return;

        }


        settings.girls.splice(index,1);

        renderSettings();

      };

    });


  coursesBox.innerHTML = "";


  settings.courses.forEach((course,index)=>{

    const row =
      document.createElement("div");

    row.className =
      "setting-row course";


    row.innerHTML =

      '<input '
      + 'data-cname="'
      + index
      + '" '
      + 'value="'
      + escapeHtml(course.name)
      + '" '
      + 'placeholder="コース名">'

      + '<input '
      + 'data-cmin="'
      + index
      + '" '
      + 'type="number" '
      + 'min="1" '
      + 'value="'
      + Number(course.minutes)
      + '" '
      + 'placeholder="分">'

      + '<input '
      + 'data-cprice="'
      + index
      + '" '
      + 'type="number" '
      + 'min="0" '
      + 'value="'
      + Number(course.price)
      + '" '
      + 'placeholder="料金">'

      + '<button '
      + 'type="button" '
      + 'class="danger" '
      + 'data-rmcourse="'
      + index
      + '">削除</button>';


    coursesBox.appendChild(row);

  });


  /*
    ★重要
    画面に入力した最新状態を
    settingsに反映する
    */

  coursesBox
    .querySelectorAll("[data-rmcourse]")
    .forEach(button=>{

      button.onclick = ()=>{

        syncCourseInputs();

        const index =
          Number(button.dataset.rmcourse);


        if(settings.courses.length <= 1){

          alert(
            "コースは最低1つ必要です。"
          );

          return;

        }


        if(
          !confirm(
            settings.courses[index].name
            + "を削除しますか？"
          )
        ){

          return;

        }


        settings.courses.splice(index,1);

        renderSettings();

      };

    });

}


/* =========================
   女の子入力を同期
========================= */

function syncGirlInputs(){

  const rows =
    [
      ...document.querySelectorAll(
        "#girlsSettings .setting-row"
      )
    ];


  const result = [];


  rows.forEach(row=>{

    const input =
      row.querySelector("[data-gname]");

    if(!input) return;

    const name =
      input.value.trim();

    if(name){

      result.push(name);

    }

  });


  if(result.length > 0){

    settings.girls = result;

  }

}


/* =========================
   コース入力を同期
========================= */

function syncCourseInputs(){

  const rows =
    [
      ...document.querySelectorAll(
        "#coursesSettings .setting-row.course"
      )
    ];


  const result = [];


  rows.forEach(row=>{

    const nameInput =
      row.querySelector("[data-cname]");

    const minInput =
      row.querySelector("[data-cmin]");

    const priceInput =
      row.querySelector("[data-cprice]");


    if(
      !nameInput ||
      !minInput ||
      !priceInput
    ){

      return;

    }


    const name =
      nameInput.value.trim();

    const minutes =
      Number(minInput.value);

    const price =
      Number(priceInput.value);


    if(
      name &&
      Number.isFinite(minutes) &&
      minutes > 0 &&
      Number.isFinite(price) &&
      price >= 0
    ){

      result.push({

        name:name,

        minutes:minutes,

        price:price

      });

    }

  });


  if(result.length > 0){

    settings.courses = result;

  }

}


/* =========================
   設定保存
========================= */

function saveSettings(){

  syncGirlInputs();

  syncCourseInputs();


  if(settings.girls.length === 0){

    alert(
      "女の子を最低1人登録してください。"
    );

    return;

  }


  if(settings.courses.length === 0){

    alert(
      "コースを最低1つ登録してください。"
    );

    return;

  }


  saveSettingsToStorage();

  fillReservationSelects();

  render();

  closeSettingsModal();

  alert("設定を保存しました。");

}


/* =========================
   女の子追加
========================= */

function addGirl(){

  syncGirlInputs();

  settings.girls.push(
    "新しい女の子"
  );

  renderSettings();

}


/* =========================
   コース追加
========================= */

function addCourse(){

  syncCourseInputs();

  settings.courses.push({

    name:"新しいコース",

  });

  renderSettings();

}


/* =========================
   設定モーダル
========================= */

function openSettings(){

  renderSettings();

  document.getElementById("settingsModal")
    .classList.add("show");

}


function closeSettingsModal(){

  document.getElementById("settingsModal")
    .classList.remove("show");

}


/* =========================
   集計
========================= */

function openSummary(){

  const reservations =
    loadReservations();


  const content =
    document.getElementById("summaryContent");


  if(reservations.length === 0){

    content.innerHTML =
      '<div class="empty">'
      + 'この日の予約はありません。'
      + '</div>';

    document.getElementById("summaryModal")
      .classList.add("show");

    return;

  }


  const totals = {};


  settings.girls.forEach(girl=>{

    totals[girl] = {

      count:0,

      sales:0

    };

  });


  let totalCount = 0;

  let totalSales = 0;


  reservations.forEach(r=>{

    if(!totals[r.girl]){

      totals[r.girl] = {

        count:0,

        sales:0

      };

    }


    totals[r.girl].count++;

    totals[r.girl].sales +=
      Number(r.price) || 0;


    totalCount++;

    totalSales +=
      Number(r.price) || 0;

  });


  let html =

    '<table class="summary-table">'
    + '<thead>'
    + '<tr>'
    + '<th>女の子</th>'
    + '<th>件数</th>'
    + '<th>売上</th>'
    + '</tr>'
    + '</thead>'
    + '<tbody>';


  Object.keys(totals).forEach(girl=>{

    html +=

      '<tr>'
      + '<td>'
      + escapeHtml(girl)
      + '</td>'
      + '<td>'
      + totals[girl].count
      + '</td>'
      + '<td>¥'
      + totals[girl].sales.toLocaleString()
      + '</td>'
      + '</tr>';

  });


  html +=

    '</tbody>'
    + '</table>'

    + '<div class="total">'
    + '合計 '
    + totalCount
    + '件　¥'
    + totalSales.toLocaleString()
    + '</div>';


  content.innerHTML = html;


  document.getElementById("summaryModal")
    .classList.add("show");

}


function closeSummary(){

  document.getElementById("summaryModal")
    .classList.remove("show");

}
