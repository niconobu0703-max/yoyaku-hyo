<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>予約表</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
 background:#f5f6f8;
 color:#222;
}

header{
 position:sticky;
 top:0;
 z-index:5;
 background:#fff;
 border-bottom:1px solid #ddd;
 padding:10px;
}

h1{
 font-size:20px;
 margin:0 0 8px;
}

.bar{
 display:flex;
 gap:6px;
 align-items:center;
 flex-wrap:wrap;
}

button,
input,
select{
 font:inherit;
}

button{
 border:1px solid #ccc;
 background:#fff;
 border-radius:8px;
 padding:8px 12px;
}

button.primary{
 background:#222;
 color:#fff;
 border-color:#222;
}

button:disabled{
 cursor:not-allowed;
}

input,
select{
 border:1px solid #ccc;
 border-radius:7px;
 padding:8px;
 background:#fff;
}

main{
 padding:10px;
 max-width:1100px;
 margin:auto;
}

.card{
 background:#fff;
 border:1px solid #ddd;
 border-radius:10px;
 padding:10px;
 margin-bottom:10px;
}

.grid{
 overflow:auto;
}

.schedule{
 display:grid;
 grid-template-columns:72px repeat(var(--girls),minmax(115px,1fr));
 min-width:400px;
}

.cell{
 border-right:1px solid #ddd;
 border-bottom:1px solid #ddd;
 min-height:52px;
 padding:5px;
 font-size:12px;
}

.head{
 font-weight:700;
 background:#fafafa;
}

.time{
 background:#fafafa;
 text-align:center;
}

.slot{
 width:100%;
 min-height:42px;
 border:0;
 background:#f8f8f8;
 padding:4px;
 text-align:left;
}

.slot.reserved{
 background:#e8f1ff;
}

.slot.blocked{
 background:#e5e5e5;
 color:#888;
 cursor:not-allowed;
}

.slot small{
 display:block;
 color:#555;
}

.modal{
 position:fixed;
 inset:0;
 background:#0006;
 display:none;
 align-items:flex-end;
 z-index:20;
}

.modal.show{
 display:flex;
}

.sheet{
 background:#fff;
 width:100%;
 max-height:92vh;
 overflow:auto;
 border-radius:16px 16px 0 0;
 padding:16px;
}

.row{
 display:flex;
 gap:8px;
 align-items:center;
 margin:7px 0;
}

.row>*{
 flex:1;
}

.row label{
 flex:0 0 105px;
}

.danger{
 color:#b00020;
}

.muted{
 color:#666;
 font-size:13px;
}

.course{
 border:1px solid #ddd;
 border-radius:10px;
 padding:10px;
 margin:8px 0;
}

.course h3{
 margin:0 0 8px;
 font-size:16px;
}

.ratio{
 display:flex;
 align-items:center;
 gap:5px;
}

.ratio input{
 width:70px;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,
td{
 border-bottom:1px solid #ddd;
 padding:7px;
 text-align:left;
 font-size:13px;
}

.notice{
 padding:8px;
 background:#fff7d6;
 border:1px solid #eadb8b;
 border-radius:8px;
 font-size:13px;
}

.error{
 padding:10px;
 background:#ffe5e5;
 border:1px solid #ffaaaa;
 border-radius:8px;
 color:#a00000;
 margin-bottom:10px;
}

.success{
 padding:10px;
 background:#e7f8e7;
 border:1px solid #9ed69e;
 border-radius:8px;
 color:#176317;
 margin-bottom:10px;
}
</style>
</head>

<body>

<header>

<h1>予約表</h1>

<div class="bar">

<input id="date" type="date">

<button onclick="today()">今日</button>

<button onclick="openSettings()">設定</button>

<button onclick="openSummary()">集計</button>

</div>

</header>


<main>

<div class="card">

<div class="muted">

予約枠をタップすると予約できます。<br>
予約時間が重ならないように自動で管理されます。<br>
同じ女の子は予約時間が重複できません。<br>
別の女の子なら同じ時間に予約できます。

</div>

</div>


<div class="card grid">

<div id="schedule"></div>

</div>

</main>


<!-- =========================
     予約画面
========================= -->

<div
 id="reserveModal"
 class="modal"
 onclick="if(event.target===this)closeModal('reserveModal')"
>

<div class="sheet">

<h2 id="reserveTitle">予約</h2>


<div class="row">

<label>時間</label>

<input
 id="rTime"
 type="time"
 step="600"
>

</div>


<div class="row">

<label>女の子</label>

<select id="rGirl"></select>

</div>


<div class="row">

<label>コース</label>

<select id="rCourse"></select>

</div>


<div id="rInfo" class="notice"></div>


<div class="row">

<label>お客様名</label>

<input
 id="rName"
 placeholder="任意"
>

</div>


<div class="row">

<button
 class="primary"
 onclick="saveReservation()"
>
保存
</button>

<button
 onclick="closeModal('reserveModal')"
>
閉じる
</button>

</div>


<button
 id="deleteBtn"
 class="danger"
 onclick="deleteReservation()"
>
この予約を削除
</button>

</div>

</div>


<!-- =========================
     設定
========================= -->

<div
 id="settingsModal"
 class="modal"
 onclick="if(event.target===this)closeModal('settingsModal')"
>

<div class="sheet">

<h2>設定</h2>


<h3>女の子</h3>

<div id="girlsBox"></div>


<div class="row">

<input
 id="newGirl"
 placeholder="名前"
>

<button onclick="addGirl()">
追加
</button>

</div>


<h3>コース設定</h3>

<div id="coursesBox"></div>


<div class="row">

<button
 class="primary"
 onclick="saveSettings()"
>
設定を保存
</button>

<button
 onclick="closeModal('settingsModal')"
>
閉じる
</button>

</div>

</div>

</div>


<!-- =========================
     集計
========================= -->

<div
 id="summaryModal"
 class="modal"
 onclick="if(event.target===this)closeModal('summaryModal')"
>

<div class="sheet">

<h2>日別集計</h2>

<div id="summary"></div>


<div class="row">

<button onclick="closeModal('summaryModal')">
閉じる
</button>

</div>

</div>

</div>


<script>

/* ==================================================
   コース時間
================================================== */

const courseMinutes=[
 40,
 60,
 90,
 100,
 120
];


/* ==================================================
   初期設定
================================================== */

const defaultSettings={

 girls:[
  "ことねさん",
  "ナヨンさん"
 ],

 courses:{

  40:{
   price:0,
   girl:6,
   shop:4
  },

  60:{
   price:0,
   girl:6,
   shop:4
  },

  90:{
   price:0,
   girl:7,
   shop:3
  },

  100:{
   price:0,
   girl:7,
   shop:3
  },

  120:{
   price:0,
   girl:6,
   shop:4
  }

 }

};


let settings=loadSettings();

let selectedId=null;


/* ==================================================
   設定読み込み
================================================== */

function loadSettings(){

 try{

  const saved=
   localStorage.getItem("shop_settings");

  if(!saved){

   return JSON.parse(
    JSON.stringify(defaultSettings)
   );

  }

  const s=JSON.parse(saved);

  return normalizeSettings(s);

 }catch(e){

  console.log(e);

  return JSON.parse(
   JSON.stringify(defaultSettings)
  );

 }

}


/* ==================================================
   設定を正常化
================================================== */

function normalizeSettings(s){

 const result={

  girls:
   Array.isArray(s.girls)&&s.girls.length
   ?s.girls
   :[...defaultSettings.girls],

  courses:{}

 };


 courseMinutes.forEach(m=>{

  const c=
   s.courses&&s.courses[m]
   ?s.courses[m]
   :defaultSettings.courses[m];


  result.courses[m]={

   price:
    Number(c.price)||0,

   girl:
    Number(c.girl)||0,

   shop:
    Number(c.shop)||0

  };

 });


 return result;

}


/* ==================================================
   設定画面
================================================== */

function openSettings(){

 const girlsBox=
  document.getElementById("girlsBox");


 girlsBox.innerHTML=
  settings.girls.map((g,i)=>`

   <div class="row">

    <input
     class="girlName"
     value="${esc(g)}"
    >

    <button
     onclick="removeGirl(${i})"
    >
     削除
    </button>

   </div>

  `).join("");


 const coursesBox=
  document.getElementById("coursesBox");


 coursesBox.innerHTML=
  courseMinutes.map(m=>{

   const c=settings.courses[m];


   return `

    <div class="course">

     <h3>${m}分</h3>

     <div class="row">

      <label>コース料金</label>

      <input
       id="p${m}"
       type="number"
       min="0"
       value="${c.price}"
      >

      <span>円</span>

     </div>


     <div class="row">

      <label>取り分</label>

      <div class="ratio">

       <input
        id="g${m}"
        type="number"
        min="0"
        value="${c.girl}"
       >

       <span>：</span>

       <input
        id="s${m}"
        type="number"
        min="0"
        value="${c.shop}"
       >

      </div>

     </div>


     <div class="muted">
      左＝女の子　右＝お店
     </div>

    </div>

   `;

  }).join("");


 document
  .getElementById("settingsModal")
  .classList.add("show");

}


/* ==================================================
   設定保存
================================================== */

function saveSettings(){

 const girls=[
  ...document.querySelectorAll(".girlName")
 ]
 .map(x=>x.value.trim())
 .filter(Boolean);


 if(girls.length===0){

  alert(
   "女の子を1人以上設定してください"
  );

  return;

 }


 const names=new Set();


 for(const name of girls){

  if(names.has(name)){

   alert(
    "同じ名前があります"
   );

   return;

  }

  names.add(name);

 }


 const courses={};


 for(const m of courseMinutes){

  const price=
   Number(
    document.getElementById("p"+m).value||0
   );


  const girl=
   Number(
    document.getElementById("g"+m).value||0
   );


  const shop=
   Number(
    document.getElementById("s"+m).value||0
   );


  if(girl+shop<=0){

   alert(
    m+"分の取り分を設定してください"
   );

   return;

  }


  courses[m]={

   price:price,
   girl:girl,
   shop:shop

  };

 }


 settings={

  girls:girls,
  courses:courses

 };


 localStorage.setItem(
  "shop_settings",
  JSON.stringify(settings)
 );


 closeModal("settingsModal");

 render();

 alert(
  "設定を保存しました"
 );

}


/* ==================================================
   女の子追加
================================================== */

function addGirl(){

 const input=
  document.getElementById("newGirl");


 const name=
  input.value.trim();


 if(!name){

  return;

 }


 if(settings.girls.includes(name)){

  alert(
   "同じ名前があります"
  );

  return;

 }


 settings.girls.push(name);

 input.value="";

 openSettings();

}


/* ==================================================
   女の子削除
================================================== */

function removeGirl(index){

 if(settings.girls.length<=1){

  alert(
   "女の子は1人以上必要です"
  );

  return;

 }


 const name=
  settings.girls[index];


 if(!confirm(
  name+"を削除しますか？"
 )){

  return;

 }


 settings.girls.splice(index,1);

 openSettings();

}


/* ==================================================
   今日の日付
================================================== */

function localDate(){

 const d=new Date();


 const z=n=>
  String(n).padStart(2,"0");


 return d.getFullYear()
  +"-"
  +z(d.getMonth()+1)
  +"-"
  +z(d.getDate());

}


function today(){

 document.getElementById("date").value=
  localDate();

 render();

}


/* ==================================================
   予約データキー
================================================== */

function reservationKey(){

 const date=
  document.getElementById("date").value;


 return "shop_reservations_"+date;

}


/* ==================================================
   予約取得
================================================== */

function getReservations(){

 try{

  const data=
   localStorage.getItem(
    reservationKey()
   );


  if(!data){

   return [];

  }


  const parsed=JSON.parse(data);


  if(!Array.isArray(parsed)){

   return [];

  }


  return parsed;

 }catch(e){

  console.log(e);

  return [];

 }

}


/* ==================================================
   予約保存
================================================== */

function setReservations(reservations){

 localStorage.setItem(
  reservationKey(),
  JSON.stringify(reservations)
 );

}


/* ==================================================
   時間 → 分
================================================== */

function timeToMinutes(time){

 if(!time){

  return 0;

 }


 const parts=time.split(":");


 return(
  Number(parts[0])*60+
  Number(parts[1])
 );

}


/* ==================================================
   分 → 時間
================================================== */

function minutesToTime(minutes){

 const h=
  String(
   Math.floor(minutes/60)
  ).padStart(2,"0");


 const m=
  String(
   minutes%60
  ).padStart(2,"0");


 return h+":"+m;

}


/* ==================================================
   重複チェック
================================================== */

function isOverlapping(
 start,
 end,
 girl,
 reservations,
 excludeId=null
){

 return reservations.some(r=>{

  /* 自分自身は除外 */

  if(
   excludeId!==null &&
   String(r.id)===String(excludeId)
  ){

   return false;

  }


  /* 別の女の子はOK */

  if(r.girl!==girl){

   return false;

  }


  const oldStart=
   timeToMinutes(r.time);


  const oldEnd=
   oldStart+
   Number(r.course);


  /*
   予約時間が1分でも重なったらNG
  */

  return(
   start<oldEnd &&
   end>oldStart
  );

 });

}


/* ==================================================
   予約画面を開く
================================================== */

function openReserve(
 time,
 girl,
 id=null
){

 selectedId=
  id===null
  ?null
  :String(id);


 const title=
  document.getElementById("reserveTitle");


 title.textContent=
  selectedId
  ?"予約編集"
  :"予約";


 const girlSelect=
  document.getElementById("rGirl");


 girlSelect.innerHTML=
  settings.girls.map(g=>`

   <option value="${esc(g)}">
    ${esc(g)}
   </option>

  `).join("");


 /*
  新規予約の場合は
  押した女の子を選択
 */

 if(!selectedId){

  girlSelect.value=girl;

 }


 const courseSelect=
  document.getElementById("rCourse");


 courseSelect.innerHTML=
  courseMinutes.map(m=>`

   <option value="${m}">
    ${m}分
   </option>

  `).join("");


 const reservations=
  getReservations();


 const old=
  selectedId
  ?reservations.find(
    r=>String(r.id)===selectedId
   )
  :null;


 if(old){

  document.getElementById("rTime").value=
   old.time;


  document.getElementById("rGirl").value=
   old.girl;


  document.getElementById("rCourse").value=
   String(old.course);


  document.getElementById("rName").value=
   old.name||"";

 }else{

  document.getElementById("rTime").value=
   time;


  document.getElementById("rName").value="";

 }


 document.getElementById("deleteBtn").style.display=
  selectedId
  ?"block"
  :"none";


 updateRInfo();


 document
  .getElementById("reserveModal")
  .classList.add("show");

}


/* ==================================================
   料金表示
================================================== */

function updateRInfo(){

 const course=
  Number(
   document.getElementById("rCourse").value
  );


 const c=
  settings.courses[course];


 if(!c){

  document.getElementById("rInfo").textContent=
   "";

  return;

 }


 const total=
  Number(c.girl)+Number(c.shop);


 const girlMoney=
  total>0
  ?Math.round(
    c.price*c.girl/total
   )
  :0;


 const shopMoney=
  c.price-girlMoney;


 document.getElementById("rInfo").textContent=
  "料金 "
  +c.price.toLocaleString()
  +"円 / 女の子 "
  +girlMoney.toLocaleString()
  +"円 / お店 "
  +shopMoney.toLocaleString()
  +"円（"
  +c.girl
  +":"
  +c.shop
  +"）";

}


document
 .getElementById("rCourse")
 .addEventListener(
  "change",
  updateRInfo
 );


/* ==================================================
   予約保存
================================================== */

function saveReservation(){

 const reservations=
  getReservations();


 const time=
  document.getElementById("rTime").value;


 const girl=
  document.getElementById("rGirl").value;


 const course=
  Number(
   document.getElementById("rCourse").value
  );


 const name=
  document.getElementById("rName").value.trim();


 if(!time){

  alert(
   "時間を入力してください"
  );

  return;

 }


 if(!girl){

  alert(
   "女の子を選択してください"
  );

  return;

 }


 if(!course){

  alert(
   "コースを選択してください"
  );

  return;

 }


 const start=
  timeToMinutes(time);


 const end=
  start+course;


 /*
  24:00を超える予約を防止
 */

 if(end>24*60){

  alert(
   "24:00を超える予約はできません"
  );

  return;

 }


 /*
  同じ女の子の重複を確認
 */

 if(
  isOverlapping(
   start,
   end,
   girl,
   reservations,
   selectedId
  )
 ){

  alert(
   "この時間はすでに予約が入っています。\n\n"
   +"同じ女の子の予約時間が重なっています。\n"
   +"別の時間を選んでください。"
  );

  return;

 }


 const id=
  selectedId||
  Date.now().toString();


 const reservation={

  id:id,

  time:time,

  girl:girl,

  course:course,

  name:name

 };


 const index=
  reservations.findIndex(
   r=>String(r.id)===String(id)
  );


 if(index>=0){

  reservations[index]=reservation;

 }else{

  reservations.push(reservation);

 }


 /*
  時間順に並べる
 */

 reservations.sort(
  (a,b)=>
   timeToMinutes(a.time)-
   timeToMinutes(b.time)
 );


 setReservations(reservations);


 selectedId=null;


 closeModal("reserveModal");


 render();

}


/* ==================================================
   予約削除
================================================== */

function deleteReservation(){

 if(
  selectedId===null ||
  selectedId===""
 ){

  alert(
   "削除する予約が選択されていません"
  );

  return;

 }


 const reservations=
  getReservations();


 const target=
  reservations.find(
   r=>String(r.id)===String(selectedId)
  );


 if(!target){

  alert(
   "予約データが見つかりません"
  );

  closeModal("reserveModal");

  selectedId=null;

  render();

  return;

 }


 const ok=
  confirm(
   "この予約を削除しますか？\n\n"
   +target.time
   +" / "
   +target.girl
   +" / "
   +target.course
   +"分"
  );


 if(!ok){

  return;

 }


 const newReservations=
  reservations.filter(
   r=>String(r.id)!==String(selectedId)
  );


 setReservations(newReservations);


 selectedId=null;


 closeModal("reserveModal");


 render();


 alert(
  "予約を削除しました"
 );

}


/* ==================================================
   予約表を表示
================================================== */

function render(){

 const date=
  document.getElementById("date");


 if(!date.value){

  date.value=localDate();

 }


 const reservations=
  getReservations();


 const startHour=10;

 const endHour=24;

 const step=10;


 let html="";


 html+=`

 <div
  class="schedule"
  style="--girls:${settings.girls.length}"
 >

 `;


 /*
  ヘッダー
 */

 html+=`

 <div class="cell head">
  時間
 </div>

 `;


 settings.girls.forEach(g=>{

  html+=`

  <div class="cell head">
   ${esc(g)}
  </div>

  `;

 });


 /*
  時間枠
 */

 for(
  let minutes=startHour*60;
  minutes<=endHour*60;
  minutes+=step
 ){

  const time=
   minutesToTime(minutes);


  html+=`

  <div class="cell time">
   ${time}
  </div>

 `;


  /*
   女の子ごと
  */

  settings.girls.forEach(girl=>{

   /*
    この時間から始まる予約
   */

   const reservation=
    reservations.find(r=>

     r.time===time &&
     r.girl===girl

    );


   /*
    すでに進行中の予約
   */

   let blocked=false;


   if(!reservation){

    blocked=
     reservations.some(r=>{

      if(r.girl!==girl){

       return false;

      }


      const oldStart=
       timeToMinutes(r.time);


      const oldEnd=
       oldStart+
       Number(r.course);


      return(
       minutes>=oldStart &&
       minutes<oldEnd
      );

     });

   }


   /*
    予約開始場所
   */

   if(reservation){

    html+=`

    <div class="cell">

     <button
      class="slot reserved"
      onclick="openReserve(
       '${reservation.time}',
       '${esc(reservation.girl)}',
       '${String(reservation.id)}'
      )"
     >

      <b>
       ${reservation.course}分
      </b>

      <small>
       ${esc(reservation.name||"予約")}
      </small>

      <small>
       タップで編集
      </small>

     </button>

    </div>

    `;

    return;

   }


   /*
    予約中の時間
   */

   if(blocked){

    html+=`

    <div class="cell">

     <button
      class="slot blocked"
      disabled
     >
      予約済み
     </button>

    </div>

    `;

    return;

   }


   /*
    空き時間
   */

   html+=`

   <div class="cell">

    <button
     class="slot"
     onclick="openReserve(
      '${time}',
      '${esc(girl)}'
     )"
    >
     ＋予約
    </button>

   </div>

   `;

  });

 }


 html+="</div>";


 document.getElementById("schedule").innerHTML=
  html;

}


/* ==================================================
   集計
================================================== */

function openSummary(){

 const reservations=
  getReservations();


 let total=0;

 let girlsTotal=0;

 let shopTotal=0;

 const byCourse={};

 const byGirl={};


 reservations.forEach(r=>{

  const c=
   settings.courses[r.course];


  if(!c){

   return;

  }


  const price=
   Number(c.price)||0;


  const ratioTotal=
   Number(c.girl)+Number(c.shop);


  const girlMoney=
   ratioTotal>0
   ?Math.round(
     price*c.girl/ratioTotal
    )
   :0;


  const shopMoney=
   price-girlMoney;


  total+=price;

  girlsTotal+=girlMoney;

  shopTotal+=shopMoney;


  if(!byCourse[r.course]){

   byCourse[r.course]={

    count:0,
    sales:0,
    girl:0,
    shop:0

   };

  }


  byCourse[r.course].count++;

  byCourse[r.course].sales+=price;

  byCourse[r.course].girl+=girlMoney;

  byCourse[r.course].shop+=shopMoney;


  byGirl[r.girl]=
   (byGirl[r.girl]||0)+girlMoney;

 });


 let html="";


 html+=`

 <p>

 予約
  <b>${reservations.length}件</b>

 <br>

 売上
 <b>${total.toLocaleString()}円</b>

 <br>

 女の子合計
 ${girlsTotal.toLocaleString()}円

 <br>

 お店合計
 ${shopTotal.toLocaleString()}円

 </p>

 `;


 html+=`

 <h3>コース別</h3>

 <table>

 <tr>

  <th>コース</th>
  <th>件数</th>
  <th>売上</th>
  <th>女の子</th>
  <th>お店</th>
  <th>割合</th>

 </tr>

 `;


 courseMinutes.forEach(m=>{

  const x=
   byCourse[m]||{

    count:0,
    sales:0,
    girl:0,
    shop:0

   };


  const c=
   settings.courses[m];


  html+=`

  <tr>

   <td>${m}分</td>

   <td>${x.count}</td>

   <td>
    ${x.sales.toLocaleString()}円
   </td>

   <td>
    ${x.girl.toLocaleString()}円
   </td>

   <td>
    ${x.shop.toLocaleString()}円
   </td>

   <td>
    ${c.girl}:${c.shop}
   </td>

  </tr>

  `;

 });


 html+=`

 </table>

 <h3>女の子別</h3>

 <table>

 <tr>

  <th>名前</th>
  <th>取り分</th>

 </tr>

 `;


 settings.girls.forEach(g=>{

  html+=`

  <tr>

   <td>
    ${esc(g)}
   </td>

   <td>
    ${(byGirl[g]||0).toLocaleString()}円
   </td>

  </tr>

  `;

 });


 html+="</table>";


 document.getElementById("summary").innerHTML=
  html;


 document
  .getElementById("summaryModal")
  .classList.add("show");

}

 if(modal){

/* ==================================================
   HTMLエスケープ
================================================== */

function esc(value){

 return String(value??"")
  .replace(
   /[&<>"']/g,

   function(match){

    return({

     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#39;"

    })[match];

   }
  );

}
